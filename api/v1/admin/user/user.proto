syntax = "proto3";

package v1.admin.user;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "v1/admin/user.proto";

option go_package = "codeberg.org/megakuul/cloudjam/pkg/api/v1/admin/user";

message CreateRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  google.protobuf.Timestamp expires = 2 [(buf.validate.field).timestamp.gt_now = true];
}

message CreateResponse {
  string code = 1;
}

message GetRequest {
  string id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {uuid: true}
  ];
}

message GetResponse {
  User user = 1;
}

message UpdateRequest {
  User mod = 1;
}

message UpdateResponse {
  User user = 1;
}

message DeleteRequest {
  string id = 1 [(buf.validate.field).string = {uuid: true}];
}

message DeleteResponse {}

message ListRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {
    gt: 0
    lte: 100
  }];
  int32 offset = 2;
}

message ListResponse {
  repeated User users = 1;
}

service UserService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
}
