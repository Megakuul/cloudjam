# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  init-cert:
    user: root
    image: cleanstart/step-cli
    command: certificate create --force --insecure --no-password --san "localhost" --san "127.0.0.1" --subtle --profile self-signed "CloudJam Database Certificate" "/usr/documentdb/cert/cert.crt" "/usr/documentdb/cert/cert.key"
    volumes:
      - ./.database/cert:/usr/documentdb/cert:U
  init-volume:
    user: root
    image: alpine
    depends_on:
      init-cert:
        condition: service_completed_successfully
    command: "chmod 777 -R /usr/documentdb"
    volumes:
      - ./.database/data:/usr/documentdb/data
      - ./.database/cert:/usr/documentdb/cert
  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:latest
    restart: always
    depends_on:
      init-cert:
        condition: service_completed_successfully
    environment:
      - USERNAME=username
      - PASSWORD=password
      - PORT=10260
      - SKIP_INIT_DATA=true
      - DATA_PATH=/usr/documentdb/data
      - CERT_PATH=/usr/documentdb/cert/cert.crt
      - KEY_FILE=/usr/documentdb/cert/cert.key
    volumes:
      - ./.database/data:/usr/documentdb/data
      - ./.database/cert:/usr/documentdb/cert
    ports:
      - 10260:10260
networks:
  default:
    name: cloudjam
