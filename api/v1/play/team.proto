syntax = "proto3";

package v1.play;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "codeberg.org/megakuul/cloudjam/pkg/api/v1/play";

message Player {
  string id = 1 [(buf.validate.field).string = {uuid: true}];
  string pub_id = 2;
  string username = 3 [
    (buf.validate.field).string.min_len = 4,
    (buf.validate.field).string.max_len = 20
  ];
}

message Team {
  string scope = 1;
  string game_id = 2 [(buf.validate.field).string = {uuid: true}];
  string id = 3 [(buf.validate.field).string = {uuid: true}];
  string name = 4 [(buf.validate.field).string = {uuid: true}];
  repeated Player players = 5;
  double score = 6;
}
