syntax = "proto3";

package v1.cloud;

import "buf/validate/validate.proto";

option go_package = "codeberg.org/megakuul/cloudjam/pkg/api/v1/cloud";

enum CompressionMode {
  Zstd = 0;
}

message Definition {
  string scope = 1;
  string provider_id = 2 [(buf.validate.field).string = {uuid: true}];
  string id = 3;
  string name = 4 [
    (buf.validate.field).string.min_len = 4,
    (buf.validate.field).string.max_len = 20
  ];
  string description = 5 [
    (buf.validate.field).string.min_len = 0,
    (buf.validate.field).string.max_len = 50
  ];
  string version = 6;
  string checksum = 7;
  CompressionMode compression = 8;
}
