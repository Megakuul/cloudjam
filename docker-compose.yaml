# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
    restart: unless-stopped
    entrypoint: ["/garage"]
    command:
      - server
      - --single-node
    configs:
      - source: "garage_toml"
        target: "/etc/garage.toml"
  garage-ui:
    image: noooste/garage-ui:latest
    container_name: garage-ui
    ports:
      - "8080:8080"
    environment:
      - GARAGE_UI_GARAGE_ENDPOINT=http://garage:3900
      - GARAGE_UI_GARAGE_ADMIN_ENDPOINT=http://garage:3903
      - GARAGE_UI_GARAGE_ADMIN_TOKEN=secret-admin-token
      - GARAGE_UI_GARAGE_REGION=garage
    depends_on:
      - garage
    restart: unless-stopped
volumes:
  garage-data:
  garage-meta:
configs:
  garage_toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"

      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "993e19a84c4f97374f24eb686e424e4a28d4a13bad33cdfc4524f6b999bd2733"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [s3_web]
      bind_addr = "[::]:3902"
      root_domain = ".web.garage.localhost"
      index = "index.html"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token = "secret-admin-token"
