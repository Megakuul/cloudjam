syntax = "proto3";

package v1.cloud;

import "buf/validate/validate.proto";

option go_package = "codeberg.org/megakuul/cloudjam/pkg/api/v1/cloud";

enum ProviderType {
  AWS = 0;
}

message Provider {
  string scope = 1;
  string id = 2;
  ProviderType type = 3;
  string name = 4 [
    (buf.validate.field).string.min_len = 4,
    (buf.validate.field).string.max_len = 20
  ];
  string description = 5 [
    (buf.validate.field).string.min_len = 0,
    (buf.validate.field).string.max_len = 50
  ];
  string credentials = 6 [
    (buf.validate.field).string.min_len = 0,
    (buf.validate.field).string.max_len = 1000
  ];
  int64 desired_accounts = 7;
}
