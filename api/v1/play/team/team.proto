syntax = "proto3";

package v1.play.team;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "v1/play/team.proto";

option go_package = "codeberg.org/megakuul/cloudjam/pkg/api/v1/play/team";

message GetRequest {
  string game_id = 1 [(buf.validate.field).string = {uuid: true}];
  string id = 2 [(buf.validate.field).string = {uuid: true}];
}

message GetResponse {
  Team team = 1;
}

message ListRequest {
  string game_id = 1 [(buf.validate.field).string = {uuid: true}];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gt: 0
    lte: 100
  }];
  string start_after = 3;
}

message ListResponse {
  repeated Team teams = 1;
}

message CreateRequest {
  Team init = 1;
}

message CreateResponse {
  string id = 1 [(buf.validate.field).string = {uuid: true}];
}

message UpdateRequest {
  Team mod = 1;
}

message UpdateResponse {}

message DeleteRequest {
  string game_id = 1 [(buf.validate.field).string = {uuid: true}];
  string id = 2 [(buf.validate.field).string = {uuid: true}];
}

message DeleteResponse {}

service TeamService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}
