# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=cloudjam-access-key
      - RUSTFS_SECRET_KEY=cloudjam-secret-key
    volumes:
      - data:/data
  init-bucket:
    image: amazon/aws-cli
    depends_on:
      - rustfs
    environment:
      - AWS_ACCESS_KEY_ID=cloudjam-access-key
      - AWS_SECRET_ACCESS_KEY=cloudjam-secret-key
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: /bin/sh -c "sleep 3 && aws s3api create-bucket --bucket cloudjam --endpoint-url http://rustfs:9000"
volumes:
  data:
